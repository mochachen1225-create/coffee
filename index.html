<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c88746">
<title>手沖一杯咖啡</title>
<style>
:root{--o:#3a2416;--wall:#f8e4c3;--cream:#fff8ec;--y:#ffd36e;--g:#7fcf9a;--r:#e8735a;
  --ff:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--o);font-family:var(--ff);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto}
header{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 4px}
#title{font-weight:900;font-size:18px;flex:1}
#step{font-size:13px;font-weight:700;opacity:.75}
#timer{font:800 20px ui-monospace,Menlo,monospace;background:#20352c;color:#8dffb8;border:3px solid var(--o);
  border-radius:10px;padding:2px 8px;display:none}
#mute{width:40px;height:40px;border-radius:50%;border:3px solid var(--o);background:var(--cream);font-size:18px;padding:0}
#stage{flex:1;min-height:0;width:100%;display:block;overflow:visible}
#panel{background:var(--cream);border:4px solid var(--o);border-bottom:0;border-radius:24px 24px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(58,36,22,.18)}
#msg{font-size:16px;line-height:1.5;margin-bottom:10px;min-height:48px}
#msg .sub{font-size:13px;opacity:.7}
#btns{display:flex;gap:10px;flex-wrap:wrap}
.b{flex:1 1 30%;min-height:54px;border:4px solid var(--o);border-radius:18px;background:var(--y);color:var(--o);
  font:900 17px var(--ff);padding:8px 10px;box-shadow:0 6px 14px rgba(58,36,22,.22);
  transition:transform .35s cubic-bezier(.3,1.9,.5,1),opacity .2s;touch-action:none}
.b.press,.b:active{transform:scale(.9);transition-duration:.08s}
.b:disabled{opacity:.4}
.b.go{background:var(--g)}.b.alt{background:#bfe3f2}.b.big{flex-basis:100%;min-height:68px;font-size:22px;background:var(--r);color:#fff}
.b small{display:block;font-size:13px;font-weight:700;opacity:.8}
.dial{display:flex;gap:4px;margin:8px 0 4px}
.dial button{flex:1;height:38px;border:3px solid var(--o);border-radius:10px;background:#fff;font:800 15px var(--ff);color:var(--o);padding:0;
  transition:transform .3s cubic-bezier(.3,1.9,.5,1)}
.dial button.on{background:var(--y);transform:scale(1.12)}
.dial button:disabled{opacity:.5}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px) scale(.8);opacity:0;background:var(--o);color:#fff;
  font-weight:800;padding:10px 18px;border-radius:999px;transition:all .35s cubic-bezier(.3,1.9,.5,1);pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#res{position:fixed;inset:0;background:rgba(58,36,22,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
#res.on{display:flex}
.sheet{width:100%;max-width:480px;max-height:94dvh;overflow-y:auto;touch-action:pan-y;background:var(--cream);border:4px solid var(--o);
  border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateY(60px) scale(.9);opacity:0}}
#radar{width:100%;max-width:340px;display:block;margin:0 auto}
.sc{text-align:center;font-weight:900;font-size:20px}.sc b{font-size:52px}
.rk{text-align:center;font-weight:900;font-size:26px;margin-top:2px}
.qp{text-align:center;font-size:15px;opacity:.75;margin-bottom:12px}
.rv{background:#fff;border:3px solid var(--o);border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:0 4px 10px rgba(58,36,22,.12)}
.rv .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.rv .av{width:30px;height:30px;border-radius:50%;border:2px solid var(--o);display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--y)}
.rv .st{color:#f2a900;letter-spacing:1px;font-size:15px}.rv .t{font-size:15px;margin-top:4px}.rv .tm{font-size:12px;opacity:.5;font-weight:600}
.rv.hid{background:#fff1f0}
.best{text-align:center;font-size:14px;margin:10px 0;opacity:.8}
</style>
</head>
<body>
<div id="app">
  <header><div id="title">手沖一杯咖啡 <span id="step"></span></div><div id="timer">0:00</div><button id="mute" aria-label="靜音">🔊</button></header>
  <svg id="stage" viewBox="0 0 360 400" preserveAspectRatio="xMidYMax meet"></svg>
  <div id="panel"><div id="msg"></div><div id="btns"></div></div>
</div>
<div id="toast"></div>
<div id="res"><div class="sheet">
  <canvas id="radar" width="600" height="560"></canvas>
  <div class="sc">總分 <b id="rScore">0</b> 分</div>
  <div class="rk" id="rRank"></div><div class="qp" id="rQuip"></div>
  <div id="rRev"></div>
  <div class="best" id="rBest"></div>
  <div id="btns2" style="display:flex;gap:10px">
    <button class="b alt" id="bShare">分享成績卡</button>
    <button class="b go" id="bAgain">再玩一次</button>
  </div>
</div></div>
<script>
/* ================= 採用的數值（請核對） =================
 * 基本參數：豆 20g、水 300g（1:15）、目標水溫 93°C、研磨中粗（刻度 7）
 * 目標總時間 3:20–3:30（200–210 秒）；195–215 秒不扣分
 * 口味（前 40% = 120g 分兩注）→ 每注「累積」目標克數：
 *   偏甜   40 → 120 → 210 → 300
 *   平衡   60 → 120 → 210 → 300
 *   偏酸亮 80 → 120 → 210 → 300
 * 每注放開手指時，累積量 ≥ 目標 − 2.5g 才算完成；誤差 2g 以內不扣分
 * 太早注水：第二注距悶蒸開始 < 35 秒，或注水前粉面積水 > 8g → 扣分
 * 稱豆：按住後流速 1.2 g/s，0.96 秒內加速到 6 g/s
 * 磨豆：刻度 1–10（1 極細 … 7 中粗 … 10 極粗），需轉 8 圈
 * 現磨現沖：磨好到第一注超過 120 秒開始扣香氣（餘韻）
 * 熱水：78°C 起每秒 +1.6°C，到 100°C 沸騰
 * 注水流速：1.5–8 g/s，依手指移動速度（流速 = 1.5 + 速度/50）
 * 粉吸水：豆重 × 2（20g 豆吸 40g，最後約得 260g 咖啡液）
 * 下水速度 = (0.3 + 0.2 × 刻度) × (0.5 + 0.5 × min(1, 積水/30g)) g/s；刻度 7 最快 1.7 g/s
 * 操作：水壺、豆罐、分享壺、濾杯都用手指拿起來拖曳；水壺在濾杯上方（x 105–225、y 50–180）才會出水
 * 豆罐：壺口在碗上方才會倒豆；濾杯：悶蒸開始後隨時可拿起，拖離 60 以上就算移開（沒注完的注按缺水計誤差）
 * 快轉：等待時 ×5；計時器顯示「沖煮時間」，快轉時一樣跟著跑，不能作弊
 * 預熱：沒沖濾紙 → 乾淨度 −1.5；沒倒溫杯水 → 稀釋（酸質、醇厚、乾淨度扣分）
 * 萃取指數 E（0 最佳，負 = 萃取不足，正 = 過萃）：
 *   E = (7 − 刻度)×0.45 + (水溫 − 93)×0.12 − (豆重 − 20)×0.08
 *       + 時間項（<195 秒：(t−195)/25；>215 秒：(t−215)/30） − 移開時粉面積水/30
 * 職級：0 打工新人、40 見習咖啡師、55 正職咖啡師、68 資深咖啡師、80 首席咖啡師、92 世界冠軍
 * 隱藏客人：「太急」累計 ≥ 3 項（每次太早注、總時間 < 190 秒、水溫 < 90°C、沒沖濾紙、移開時積水 > 10g、豆 < 18g）
 * 莫名負評出現機率：30%
 * ====================================================== */
const $=s=>document.querySelector(s), O='#3a2416', FF='"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
const svg=$('#stage'), msg=$('#msg'), btns=$('#btns');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const hash=i=>{const x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TASTE={sweet:[40,120,210,300],bal:[60,120,210,300],bright:[80,120,210,300]};
const GL=['','極細','極細','細','細','中細','中','中粗','粗','極粗','極粗'];
const ST=['','準備','稱豆','磨豆','熱水','選口味','歸零','注水','移開濾杯'];

/* ---------- 音效（Web Audio） ---------- */
const snd=(()=>{let ac,nb,pg,muted=false;
  function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
    nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(ac.state==='suspended')ac.resume();return ac}
  function burst(f,q,dur,vol){const a=A();if(!a||muted)return;const s=a.createBufferSource();s.buffer=nb;
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;const g=a.createGain(),t=a.currentTime;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(bp).connect(g).connect(a.destination);
    s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
  function tone(f,d0,dur,vol,type){const a=A();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+d0;
    o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
  return{unlock:A,
    bean(){burst(2500+Math.random()*2500,6,.05,.6)},
    grind(){burst(900+Math.random()*1500,2,.07,.7);burst(300,1,.05,.3)},
    splash(){burst(500,.7,.5,.5)},
    tap(){tone(660,0,.06,.06,'triangle')},
    ding(){tone(880,0,.15,.12);tone(1320,.08,.2,.1)},
    bad(){tone(200,0,.25,.1,'square')},
    done(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.4,.15))},
    pour(level){const a=A();if(!a)return;if(!pg){const s=a.createBufferSource();s.buffer=nb;s.loop=true;const f=a.createBiquadFilter();
      f.type='bandpass';f.frequency.value=750;f.Q.value=.8;pg=a.createGain();pg.gain.value=0;s.connect(f).connect(pg).connect(a.destination);s.start()}
      pg.gain.setTargetAtTime(muted?0:level*.4,a.currentTime,.05)},
    toggle(){muted=!muted;if(pg)pg.gain.value=0;return muted}}})();
$('#mute').onclick=()=>{$('#mute').textContent=snd.toggle()?'🔇':'🔊'};

/* ---------- SVG 道具（貼紙風：粗外框＋平塗雙色陰影＋白色高光） ---------- */
const sw=w=>`stroke="${O}" stroke-width="${w}" stroke-linejoin="round"`;
const sh=(cx,y,rx)=>`<ellipse cx="${cx}" cy="${y}" rx="${rx}" ry="${rx*.1+3}" fill="${O}" opacity=".16"/>`;
const ol=(d,w)=>`<path d="${d}" fill="none" ${sw(w)}/>`;
const hl=(d,w,op)=>`<path d="${d}" stroke="#fff" stroke-width="${w}" fill="none" stroke-linecap="round" opacity="${op||.85}"/>`;
const DEFS=`<defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8e4c3"/><stop offset="1" stop-color="#f3d5a9"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf8f4f"/><stop offset="1" stop-color="#ad7036"/></linearGradient>
<pattern id="tile" width="36" height="18" patternUnits="userSpaceOnUse"><rect width="36" height="18" fill="#f7dfb9"/><path d="M0 .75h36M0 9.75h36M18 0v9M.75 9v9" stroke="#e6c393" stroke-width="1.5"/></pattern></defs>`;
function bgS(){return DEFS+`<rect y="-400" width="360" height="400" fill="#f8e4c3"/><rect width="360" height="400" fill="url(#wall)"/><rect y="196" width="360" height="100" fill="url(#tile)"/><rect y="192" width="360" height="6" fill="#e9c391"/>
<rect x="24" y="34" width="96" height="112" rx="14" fill="#fff4d6" ${sw(5)}/><rect x="28" y="92" width="88" height="50" rx="4" fill="#ffe7ad"/><path d="M72 36v108M26 90h92" stroke="${O}" stroke-width="4"/>
${hl('M38 52l18-10M38 68l30-20M86 108l20-12',5)}<rect x="16" y="142" width="112" height="10" rx="5" fill="#e3a865" ${sw(4)}/>
<line x1="292" y1="-400" x2="292" y2="34" stroke="${O}" stroke-width="3"/><circle cx="292" cy="62" r="40" fill="#fff3c8" opacity=".6"/>
<path d="M266 54q26-32 52 0z" fill="#e8735a" ${sw(4)}/><path d="M298 30q12 8 16 20" stroke="#b9503b" stroke-width="5" fill="none"/><circle cx="292" cy="58" r="6" fill="#fff6c8" ${sw(3)}/>
<rect y="300" width="360" height="100" fill="url(#wood)"/><rect y="308" width="360" height="7" fill="${O}" opacity=".12"/><path d="M90 312v88M210 312v88M320 312v88" stroke="#9c6230" stroke-width="3"/>
<path d="M14 340q30-5 60 0M110 360q40 6 80 0M228 335q36-5 72 0M240 378q30 5 60 0M20 382q26-4 52 0M130 334q20-4 40 0" stroke="#a0652f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<rect x="-6" y="292" width="372" height="16" rx="4" fill="#e3a865" ${sw(5)}/><rect x="12" y="296" width="80" height="4" rx="2" fill="#fff" opacity=".55"/>`}
function beanS(x,y,r){return `<g transform="translate(${x} ${y}) rotate(${r})"><ellipse rx="5.5" ry="4" fill="#7a4524" ${sw(2)}/><path d="M-3.2 .4Q0-1.4 3.2 .4" stroke="${O}" stroke-width="1.4" fill="none" stroke-linecap="round"/><ellipse cx="-2" cy="-1.9" rx="1.6" ry=".9" fill="#c98d5c"/></g>`}
function scaleS(cx,by,txt,tare){const body=`M${cx-70} ${by-36}h140q12 0 12 12v12q0 12-12 12h-140q-12 0-12-12v-12q0-12 12-12z`;
  return sh(cx,by+3,92)+`<rect x="${cx-70}" y="${by-4}" width="16" height="8" rx="3" fill="#6d6259" ${sw(3)}/><rect x="${cx+54}" y="${by-4}" width="16" height="8" rx="3" fill="#6d6259" ${sw(3)}/>
<path d="${body}" fill="#f2ede5"/><path d="M${cx-82} ${by-14}h164v2q0 12-12 12h-140q-12 0-12-12z" fill="#dcd3c6"/>${ol(body,5)}
<rect x="${cx-74}" y="${by-46}" width="148" height="12" rx="6" fill="#cbc3b6" ${sw(4)}/><rect x="${cx-66}" y="${by-43}" width="58" height="3" rx="1.5" fill="#fff" opacity=".75"/>
<rect x="${cx-38}" y="${by-30}" width="76" height="23" rx="6" fill="#1d3029" ${sw(3)}/><rect x="${cx-34}" y="${by-27}" width="22" height="3" rx="1.5" fill="#fff" opacity=".2"/>
<text x="${cx}" y="${by-12.5}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#8dffb8">${txt}</text>
<circle cx="${cx-58}" cy="${by-19}" r="6" fill="#cbc3b6" ${sw(2.5)}/><rect x="${cx-78}" y="${by-32}" width="9" height="5" rx="2.5" fill="#fff" opacity=".9"/>
${tare?`<circle cx="${cx+60}" cy="${by-18}" r="10" fill="#e8735a" ${sw(3)}/><text x="${cx+60}" y="${by-15.5}" text-anchor="middle" font-size="7" font-weight="900" fill="#fff">歸零</text>`:''}`}
function jarS(tx,ty,rot,open){let b='';for(let i=0;i<20;i++){const row=Math.floor(i/4);b+=beanS(-22+(i%4)*14+(row%2)*7,40-row*9,i*47)}
  const body='M-34-26q0-14 14-14h40q14 0 14 14v58q0 14-14 14h-40q-14 0-14-14z';
  return (rot===0?sh(tx,ty+47,42):'')+`<g transform="translate(${tx} ${ty}) rotate(${rot})"><clipPath id="jc"><path d="${body}"/></clipPath>
<path d="${body}" fill="#fdf6e6"/><g clip-path="url(#jc)">${b}<rect x="18" y="-40" width="20" height="90" fill="${O}" opacity=".1"/></g>${ol(body,5)}
<rect x="-24" y="-17" width="48" height="27" rx="6" fill="#f7c873" ${sw(3)}/><path d="M-24-10h48" stroke="#e8735a" stroke-width="3"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="900" fill="${O}">咖啡豆</text>
<rect x="-28" y="-32" width="6" height="44" rx="3" fill="#fff" opacity=".9"/><rect x="-28" y="-44" width="56" height="8" rx="3" fill="#eadcc2" ${sw(3)}/>
${open?`<ellipse cx="0" cy="-44" rx="27" ry="5" fill="#5a3320" ${sw(3)}/>`:`<rect x="-38" y="-60" width="76" height="22" rx="8" fill="#b97a45" ${sw(5)}/><path d="M-30-48q15-3 30 0t28 0" stroke="#8f5a2e" stroke-width="2" fill="none"/><rect x="-30" y="-56" width="14" height="4" rx="2" fill="#fff" opacity=".6"/>`}</g>`}
function bowlS(cx,by,g){let s=`<ellipse cx="${cx}" cy="${by-44}" rx="38" ry="7" fill="#e9d6b8" ${sw(3)}/>`;const n=Math.round(g*1.6),heap=Math.min(22,g*.9);
  for(let i=0;i<n;i++){const r2=hash(i+99);s+=beanS(cx+(hash(i)-.5)*66*(1-.65*r2),by-40-r2*heap,hash(i+7)*180)}
  const d=`M${cx-40} ${by-44}h80q-4 44-40 44q-36 0-40-44z`;
  return s+`<path d="${d}" fill="#fff8ec"/><path d="M${cx+14} ${by-44}h26q-4 44-40 44q24-10 14-44z" fill="#f0dcc0"/><path d="M${cx-39} ${by-30}h78" stroke="#e8735a" stroke-width="5"/>${ol(d,5)}${hl(`M${cx-30} ${by-38}q2 18 12 26`,5)}`}
function grinderS(tx,ty,s,ang,set){const ex=Math.cos(ang)*64,ey=-196+Math.sin(ang)*18,back=Math.sin(ang)<0;let tk='',kn='';
  for(let i=0;i<10;i++)if(i<3||i>6)tk+=`<line x1="${-36+i*8}" y1="-22" x2="${-36+i*8}" y2="-12" stroke="#fff" stroke-width="2"/>`;
  for(let i=-3;i<=3;i++)kn+=`<line x1="${i*9}" y1="${-178+Math.abs(i)*.6}" x2="${i*9}" y2="${-170+Math.abs(i)*.3}" stroke="${O}" stroke-width="1.5" opacity=".4"/>`;
  const arm=`<path d="M0-196L${ex} ${ey}" stroke="${O}" stroke-width="14" stroke-linecap="round"/><path d="M0-196L${ex} ${ey}" stroke="#7b848e" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="${ex}" cy="${ey-10}" rx="10" ry="14" fill="#b97a45" ${sw(4)}/><ellipse cx="${ex-3}" cy="${ey-15}" rx="3" ry="5" fill="#fff" opacity=".6"/>`;
  return `<g transform="translate(${tx} ${ty}) scale(${s})">${sh(0,2,58)}<clipPath id="gc"><rect x="-38" y="-176" width="76" height="150" rx="18"/></clipPath>
<rect x="-38" y="-176" width="76" height="150" rx="18" fill="#c8d0d9"/><g clip-path="url(#gc)"><rect x="16" y="-176" width="24" height="150" fill="#a8b1bc"/>
<rect x="-38" y="-120" width="76" height="40" fill="#c98a4b"/><rect x="16" y="-120" width="24" height="40" fill="#a96e38"/><path d="M-30-108q14-4 28 0t26 0M-34-94q18 4 36 0t30 0" stroke="#9c6230" stroke-width="2" fill="none"/></g>
<path d="M-38-120h76M-38-80h76" stroke="${O}" stroke-width="4"/><rect x="-38" y="-176" width="76" height="150" rx="18" fill="none" ${sw(5)}/>
${hl('M-26-160v28M-26-70v32',7,.8)}
<rect x="-44" y="-32" width="88" height="32" rx="10" fill="#6d7680" ${sw(5)}/><rect x="18" y="-30" width="22" height="28" rx="6" fill="#5a626b"/>${tk}
<rect x="-14" y="-29" width="28" height="24" rx="5" fill="#fff" ${sw(3)}/><text x="0" y="-11" text-anchor="middle" font-size="16" font-weight="900" fill="${O}">${set}</text>

  p(){const N=['悶蒸','第二注','第三注','第四注'],ff={t:G.ff?'⏸ 正常速度':'⏩ 快轉',c:'alt',on:()=>{G.ff=!G.ff;this.p()}};
    $('#step').textContent=G.idx>=4?'・8/8 移開濾杯':'・7/8 注水';
    if(G.idx<4)panel(`<b>${N[G.idx]}</b>：<b>拿起水壺</b>，在濾杯上由中心往外畫<b>螺旋</b>注水，注到 <b>${G.T[G.idx]}g</b>。<br><span class="sub">每一注之前，要等粉面上的水降下去。</span>`,[ff]);
    else panel('步驟 8：注水完成！看準時間，把<b>濾杯拿起來移開</b>。<br><span class="sub">目標總時間 3:20–3:30</span>',[ff])},
  // 拿水壺：從右邊拿起；拿濾杯：悶蒸開始後隨時可拿起移開（拖離 60 以上才算）
  down(p){G.f=p;if(inBox(p,250,190,355,300)){G.carry='k';if(G.ff){G.ff=false;this.p()}}else if(G.started[0]&&inBox(p,95,60,235,165)){G.carry='d';G.d0=p}},
  move(p){G.f=p},
  up(){if(G.carry==='d'&&Math.hypot(G.f.x-G.d0.x,G.f.y-G.d0.y)>60){for(;G.idx<4;G.idx++)R.errs.push(G.cum-G.T[G.idx]);
      R.time=G.t;R.bedLeft=G.bed;G.carry=null;snd.pour(0);snd.done();finish();return}
    G.carry=null;this.stop()},
  start(){G.pour=true;G.p=G.pp=G.f;G.fs=0;if(G.idx>=4||G.started[G.idx])return;G.started[G.idx]=true;
    if(G.idx===0){G.bloom=G.t;R.stale=(performance.now()-R.grindEnd)/1000}
    else if(G.bed>8||(G.idx===1&&G.t-G.bloom<35)){R.early++;snd.bad();toast('太早了！粉面上還有水 💦')}},
  stop(){if(!G.pour)return;G.pour=false;snd.pour(0);const i0=G.idx;
    while(G.idx<4&&G.cum>=G.T[G.idx]-2.5){R.errs.push(G.cum-G.T[G.idx]);G.idx++}
    if(i0>=4)R.errs[3]=G.cum-G.T[3];if(G.idx>i0){snd.ding();this.p()}},
  update(dt){const on=G.carry==='k'&&inBox(G.f,105,50,225,180);if(on&&!G.pour)this.start();else if(!on&&G.pour)this.stop();
    const sd=dt*(G.ff&&G.carry!=='k'?5:1);G.t+=sd;
    if(G.pour){G.p=G.f;const v=Math.hypot(G.p.x-G.pp.x,G.p.y-G.pp.y)/Math.max(dt,1e-3);G.pp=G.p;G.fs=G.fs*.75+v*.25;
      const fl=clamp(1.5+G.fs/50,1.5,8);G.cum+=fl*dt;G.bed+=fl*dt;R.pourT+=dt;if(G.fs>30&&Math.hypot(G.p.x-165,G.p.y-113)<90)R.moveT+=dt;snd.pour(fl/8)}
    const a=Math.min(G.bed,10*sd,2*R.bean-G.abs);if(a>0){G.bed-=a;G.abs+=a}
    if(G.carry!=='d'){const d=Math.min(G.bed,G.drain*(.5+.5*Math.min(1,G.bed/30))*sd);G.bed-=d;G.liq+=d}
    $('#timer').textContent=fmt(G.t)+(G.ff&&G.carry!=='k'?' ×5':'')},
  scene(t){const bl=G.bloom!==null&&G.t-G.bloom<40&&G.idx<=1,dh=G.carry==='d';
    let s=scaleS(165,300,G.cum.toFixed(1)+'g')+(dh?serverS(165,254,G.liq,'#5a2e14')+dripperS(G.f.x,G.f.y-40,true,G.bed,G.t,bl):brewerS(165,254,G.liq,'#5a2e14',true,G.bed,G.t,bl));
    if(!dh&&(G.bed>.3||G.abs>=2*R.bean&&G.liq>0&&G.bed>.05))s+=`<line x1="165" y1="160" x2="165" y2="${254-Math.min(85,G.liq/300*80)}" stroke="#7a4524" stroke-width="${G.bed>3?3:2}" stroke-dasharray="${G.bed>3?'none':'4 8'}"/>`;
    if(G.carry==='k'){const k=heldKettle(G.f,G.pour,62,R.temp);s+=k.s;if(G.pour)s+=stream(k.tip,{x:clamp(G.f.x,125,205),y:151-24-Math.min(54,G.bed*.5)})}
    else s+=kettleS(305,300,.65,0,R.temp);return s}}];

/* ---------- 指標事件 & 主迴圈 ---------- */
svg.addEventListener('pointerdown',e=>{snd.unlock();try{svg.setPointerCapture(e.pointerId)}catch(_){}S&&S.down&&S.down(sp(e))});
svg.addEventListener('pointermove',e=>{S&&S.move&&S.move(sp(e))});
['pointerup','pointercancel'].forEach(n=>svg.addEventListener(n,()=>{S&&S.up&&S.up()}));
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(S){S.update&&S.update(dt);svg.innerHTML=bgS()+S.scene(now/1000)}requestAnimationFrame(loop)}

/* ---------- 評分 ---------- */
const RANKS=[[0,'打工新人','店長說明天不用來了'],[40,'見習咖啡師','再練一下，會越來越好'],[55,'正職咖啡師','可以獨當一面了'],[68,'資深咖啡師','熟客都指定要你沖'],[80,'首席咖啡師','整間店的招牌'],[92,'世界冠軍','粕谷哲表示想認識你']];
const NAMES=['陳小姐','Kevin Lin','愛喝咖啡的阿伯','林太太','在地嚮導 王先生','Amy Huang','路過的上班族','張同學','Jessie','黃老師'];
const WEIRD=['店員沒有笑，一顆星。','一杯咖啡要等三分鐘？一顆星。','為什麼沒有珍珠？','停車位很難找，一顆星。','杯子太可愛捨不得喝，害我咖啡冷掉，一顆星。','咖啡很好喝，但我今天心情不好。','我其實是來借廁所的。'];
const GOOD={sweet:['甜感像焦糖，回甘很舒服，會再來！','喝得到黑糖跟堅果的甜，好溫柔的一杯。'],bal:['酸甜平衡又乾淨，很標準的好咖啡。','每一口都很順，吧台手很穩。'],bright:['柑橘調好明亮，像夏天一樣！','果酸很漂亮，喝完整個人都醒了。']};
function evaluate(){const r=R,tb={sweet:[.5,1.5,.4],bal:[1,1,1],bright:[1.5,.5,.4]}[r.taste];
  let E=(7-r.grind)*.45+(r.temp-93)*.12-(r.bean-20)*.08;const t=r.time;
  if(t<195)E+=(t-195)/25;else if(t>215)E+=(t-215)/30;E-=r.bedLeft/30;
  const un=Math.max(0,-E),ov=Math.max(0,E),pe=r.errs.reduce((a,e)=>a+Math.max(0,Math.abs(e)-2),0)*.06;
  const spr=r.pourT?Math.min(1,r.moveT/r.pourT*1.15):0,st=clamp((r.stale-120)/60,0,3),nr=r.rinsed?0:1,nd=r.rinsed&&!r.dumped?1:0,ea=r.early,str=r.bean-20;
  const v=[8.5+tb[0]-un*.9-ov-pe*.5-nd*.8, 8.5+tb[1]-un*1.2-ov*.9-pe-ea*.4, 9.3+clamp(str*.25,-2,.5)-un*.7-nd*2-r.bedLeft/40,
    10-ea*1.3-(1-spr)*2.5-nr*1.5-nd-ov*.7, 9+tb[2]-Math.abs(E)*1.1-pe*1.2-Math.abs(str)*.15, 9.6-st*.8-ov-un*.6-(r.temp<88?.8:0)].map(x=>clamp(Math.round(x*10)/10,0,10));
  const score=Math.round(v.reduce((a,b)=>a+b)/60*100);let rk=RANKS[0];RANKS.forEach(x=>{if(score>=x[0])rk=x});
  // 問題清單（嚴重度高的先講）
  const iss=[];const add=(c,w,txt)=>{if(c)iss.push([w,txt])};
  add(nr,3,'喝到一股紙味，濾紙是沒先沖過嗎？');add(nd,3,'咖啡水水的……原來溫杯的水沒倒掉 😅');
  add(r.grind<=5,(6-r.grind)*1.2,'苦到我想起前任。');add(r.grind>=9,(r.grind-8)*1.5,'像在喝有咖啡味的水。');
  add(r.temp<89,(93-r.temp)/2,'酸得很尖，水溫是不是不夠？');add(r.temp>96,(r.temp-93)/2,'有焦苦味，是用剛滾的水直接沖的吧。');
  add(r.bean<18.5,2,'味道好淡，豆子是不是放太少？');add(r.bean>21.5,2,'好濃好重，豆子手抖放太多了吧。');
  add(ea>0,ea*1.5,'口感有點雜，注水節奏太急了。');add(t<190||r.bedLeft>10,2.5,'感覺還沒萃完，淡淡酸酸的。');add(t>230,(t-215)/20,'放太久了，尾韻澀澀的。');
  add(pe>1,pe,'每一口味道不太一樣，有點不穩。');add(spr<.6,2,'有點雜味，注水好像都沖在同一點。');add(st>0,st,'香氣不太出來，豆子是不是磨好放很久？');
  iss.sort((a,b)=>b[0]-a[0]);
  const base=clamp(Math.round(score/20),1,5),names=[...NAMES].sort(()=>Math.random()-.5),good=[...GOOD[r.taste]],revs=[];
  const pos=()=>good.length?good.shift():'乾淨又香，吧台手很專業。';
  if(score>=60)revs.push({s:base,t:score>=80?pos():'還不錯，但好像還能更好。'});
  for(let i=0;revs.length<3;i++)revs.push(iss[i]?{s:clamp(base-1-(iss[i][0]>2.5?1:0),1,5),t:iss[i][1]}:{s:base,t:pos()});
  if(Math.random()<.3)revs[2]={s:1,t:pick(WEIRD),w:1};
  revs.forEach((x,i)=>x.n=names[i]);
  const rush=ea+(t<190)+(r.temp<90)+nr+(r.bedLeft>10)+(r.bean<18);
  if(rush>=3)revs.push({s:2,t:'你又不上班，急什麼。',n:'隱藏客人',h:1});
  const funny=revs.find(x=>x.w)||revs.find(x=>x.h)||[...revs].sort((a,b)=>a.s-b.s)[0];
  const L=clamp(24-E*6,10,40);
  return{v,score,rk,revs,funny,col:`hsl(25,58%,${L}%)`}}

function drawRadar(x,cx,cy,rad,v,fs){const L=['酸質','甜感','醇厚度','乾淨度','平衡','餘韻'],P=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  x.lineJoin='round';const poly=f=>{x.beginPath();for(let i=0;i<6;i++){const p=P(i,f(i));i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])}x.closePath()};
  for(let k=5;k>=1;k--){poly(()=>rad*k/5);x.fillStyle=k%2?'#fff6e6':'#f3e2c4';x.fill();x.strokeStyle='rgba(58,36,22,.25)';x.lineWidth=fs/10;x.stroke()}
  poly(i=>rad*v[i]/10);x.fillStyle='rgba(232,115,90,.6)';x.fill();x.strokeStyle=O;x.lineWidth=fs/5;x.stroke();
  x.fillStyle=O;x.font=`800 ${fs}px ${FF}`;x.textAlign='center';x.textBaseline='middle';
  for(let i=0;i<6;i++){const p=P(i,rad*v[i]/10);x.beginPath();x.arc(p[0],p[1],fs/5,0,7);x.fill();const q=P(i,rad+fs*1.25);x.fillText(`${L[i]} ${v[i]}`,q[0],q[1])}}

function makeCard(res){const W=720,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#f8e4c3';x.fillRect(0,0,W,H);x.fillStyle='#c88746';x.fillRect(0,H-100,W,100);x.fillStyle='#e3a865';x.fillRect(0,H-112,W,22);
  x.strokeStyle=O;x.lineWidth=6;x.strokeRect(-10,H-112,W+20,22);
  x.fillStyle=O;x.textAlign='center';x.textBaseline='alphabetic';x.font=`900 56px ${FF}`;x.fillText('手沖一杯咖啡',W/2,96);
  // 咖啡杯插圖
  x.save();x.translate(190,470);x.scale(1.6,1.6);x.lineJoin='round';x.lineCap='round';const P=k=>new Path2D(CUP[k]);
  x.strokeStyle='rgba(58,36,22,.35)';x.lineWidth=4;x.stroke(P('steam'));x.strokeStyle=O;
  x.fillStyle='#fff8ec';x.lineWidth=5;x.fill(P('saucer'));x.stroke(P('saucer'));
  x.lineWidth=18;x.stroke(P('handle'));x.strokeStyle='#fff';x.lineWidth=8;x.stroke(P('handle'));
  x.fillStyle='#f1e2cb';x.fill(P('ring'));x.strokeStyle=O;x.lineWidth=5;x.fillStyle='#fff';x.fill(P('body'));x.fillStyle='#f0e4d6';x.fill(P('shade'));x.stroke(P('body'));
  x.strokeStyle='#e8735a';x.lineWidth=7;x.save();x.clip(P('body'));x.stroke(P('band'));x.restore();
  x.strokeStyle=O;x.lineWidth=4;x.fillStyle=res.col;x.fill(P('coffee'));x.stroke(P('coffee'));
  x.strokeStyle='#ffe9c9';x.lineWidth=7;x.stroke(P('hl'));x.restore();
  x.fillStyle=O;x.font=`900 50px ${FF}`;x.fillText(res.rk[1],510,270);x.font=`700 24px ${FF}`;x.globalAlpha=.75;x.fillText(res.rk[2],510,312);x.globalAlpha=1;
  x.font=`900 130px ${FF}`;x.fillText(res.score,510,450);x.font=`800 28px ${FF}`;x.fillText('分',510,492);
  drawRadar(x,W/2,720,150,res.v,28);
  // 最好笑的評論
  const f=res.funny;x.fillStyle='#fff';x.strokeStyle=O;x.lineWidth=5;x.beginPath();x.roundRect?x.roundRect(50,945,W-100,140,24):x.rect(50,945,W-100,140);x.fill();x.stroke();
  x.textAlign='left';x.fillStyle=O;x.font=`800 24px ${FF}`;x.fillText(f.n,80,985);x.fillStyle='#f2a900';x.fillText('★'.repeat(f.s)+'☆'.repeat(5-f.s),80+x.measureText(f.n+'　').width,985);
  x.fillStyle=O;x.font=`700 28px ${FF}`;let line='',y=1030;for(const ch of '「'+f.t+'」'){if(x.measureText(line+ch).width>W-160){x.fillText(line,80,y);y+=38;line=ch}else line+=ch}x.fillText(line,80,y);
  x.textAlign='center';x.fillStyle='#fff8ec';x.font=`800 24px ${FF}`;x.fillText('粕谷哲 4:6 法・20g 豆・300g 水・93°C',W/2,H-38);return c}

let cardBlob=null,cardName='';
function finish(){$('#timer').style.display='none';const res=evaluate();
  const c=$('#radar').getContext('2d');c.clearRect(0,0,600,560);drawRadar(c,300,290,190,res.v,28);
  $('#rScore').textContent=res.score;$('#rRank').textContent=res.rk[1];$('#rQuip').textContent='「'+res.rk[2]+'」';
  $('#rRev').innerHTML=res.revs.map(r=>`<div class="rv ${r.h?'hid':''}"><div class="h"><div class="av">${r.n[0]}</div>${r.n}<span class="tm">剛剛</span></div>
    <div class="st">${'★'.repeat(r.s)}${'☆'.repeat(5-r.s)}</div><div class="t">${r.t}</div></div>`).join('');
  let best=null;try{best=JSON.parse(localStorage.getItem('coffee_best')||'null')}catch(e){}
  let nb=false;if(!best||res.score>best.score){best={score:res.score,rank:res.rk[1]};nb=true;try{localStorage.setItem('coffee_best',JSON.stringify(best))}catch(e){}}
  $('#rBest').textContent=nb?`🏆 新紀錄！${best.score} 分・${best.rank}`:`最佳紀錄：${best.score} 分・${best.rank}`;
  cardBlob=null;cardName=`我是${res.rk[1]}，${res.score} 分！`;makeCard(res).toBlob(b=>cardBlob=b,'image/png');
  $('#res').classList.add('on');$('#res .sheet').scrollTop=0}
$('#bAgain').onclick=()=>{$('#res').classList.remove('on');reset();go(1)};
$('#bShare').onclick=async()=>{if(!cardBlob){toast('成績卡準備中…');return}
  const file=new File([cardBlob],'coffee-score.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'手沖一杯咖啡',text:cardName});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(cardBlob);a.download='coffee-score.png';document.body.appendChild(a);a.click();a.remove();toast('已下載成績卡圖片')};

reset();go(0);requestAnimationFrame(loop);
</script>
